{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Family | The Hungry Palette</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />

    <style>
        :root {
            --gold: #b89564;
            --midnight: #121212;
            --cream: #fdfaf5;
            --error: #c53030;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--midnight);
            overflow: hidden;
        }

        .reg-wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Left Side Visual */
        .reg-visual {
            flex: 1;
            position: relative;
            background: linear-gradient(rgba(18, 18, 18, 0.5), rgba(18, 18, 18, 0.5)),
                        url('https://images.unsplash.com/photo-1552566626-52f8b828add9?q=80&w=2070') center/cover;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 60px;
        }

        @media (min-width: 992px) { .reg-visual { display: flex; } }

        .visual-content { max-width: 500px; }
        .visual-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .visual-content p {
            font-size: 1rem;
            letter-spacing: 1px;
            opacity: 0.8;
            border-left: 2px solid var(--gold);
            padding-left: 20px;
        }

        /* Right Side Form */
        .reg-form-side {
            flex: 1.2;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--midnight);
            text-decoration: none;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .form-header p {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width { grid-column: span 2; }

        .input-group-custom {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 12px 0;
            font-size: 0.95rem;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            outline: none;
            background: transparent;
            transition: 0.3s;
        }

        .input-group-custom label {
            position: absolute;
            top: 12px;
            left: 0;
            color: #aaa;
            pointer-events: none;
            transition: 0.3s;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group-custom input:focus ~ label,
        .input-group-custom input:not(:placeholder-shown) ~ label {
            top: -12px;
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 600;
        }

        .input-group-custom input:focus { border-bottom: 1px solid var(--gold); }

        /* Error Box */
        #error-display {
            background: #fff5f5;
            color: var(--error);
            padding: 15px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid var(--error);
        }

        .btn-register {
            width: 100%;
            padding: 18px;
            background: var(--midnight);
            color: white;
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: var(--gold);
            letter-spacing: 5px;
        }

        .login-link {
            margin-top: 30px;
            font-size: 0.85rem;
            text-align: center;
            color: #666;
        }

        .login-link a {
            color: var(--midnight);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--gold);
        }

        .btn-back {
            position: absolute;
            top: 30px;
            right: 40px;
            color: var(--midnight);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="reg-wrapper">
        <div class="reg-visual">
            <div class="visual-content" data-aos="fade-right">
                <p class="text-gold">Join the Family</p>
                <h1>Experience <br><em>Mastery.</em></h1>
                <p>Register to unlock a world of artisanal catering and exclusive event planning.</p>
            </div>
        </div>

        <div class="reg-form-side">
            <a href="/" class="btn-back"><i class="fas fa-arrow-left me-2"></i> Back to Site</a>

            <div class="form-container">
                <a href="/" class="brand-logo">THE HUNGRY PALETTE</a>

                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Start your journey with us</p>
                </div>

                <div id="error-display"></div>

                <form id="regForm" method="POST">
                    {% csrf_token %}

                    <div class="form-grid">
                        <div class="input-group-custom full-width">
                            <input type="text" name="fn" id="fullName" placeholder=" " required>
                            <label>Full Name</label>
                        </div>

                        <div class="input-group-custom">
                            <input type="email" name="email" id="email" placeholder=" " required>
                            <label>Email Address</label>
                        </div>

                        <div class="input-group-custom">
                            <input type="tel" name="phoneno" id="phone" placeholder=" " required>
                            <label>Phone Number</label>
                        </div>

                        <div class="input-group-custom full-width">
                            <input type="text" name="un" placeholder=" " required>
                            <label>Username</label>
                        </div>

                        <div class="input-group-custom">
                            <input type="password" name="psw" id="pass1" placeholder=" " required>
                            <label>Password</label>
                        </div>

                        <div class="input-group-custom">
                            <input type="password" name="cpws" id="pass2" placeholder=" " required>
                            <label>Confirm Password</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-register">Join the Palette</button>
                </form>

                <div class="login-link">
                    <p>Already a member? <a href="/login/">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({ duration: 1200 });

        const form = document.getElementById('regForm');
        const errorDisplay = document.getElementById('error-display');

        form.addEventListener('submit', function(event) {
            let errors = [];
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const pass1 = document.getElementById('pass1').value;
            const pass2 = document.getElementById('pass2').value;

            if (!email.includes('@')) {
                errors.push("Please enter a valid email address.");
            }
            if (!/^\d{10}$/.test(phone)) {
                errors.push("Phone number must be exactly 10 digits.");
            }
            if (pass1 !== pass2) {
                errors.push("Passwords do not match.");
            }

            if (errors.length > 0) {
                event.preventDefault();
                errorDisplay.innerHTML = errors.join('<br>');
                errorDisplay.style.display = 'block';
                document.querySelector('.reg-form-side').scrollTop = 0;
            }
        });
    </script>
</body>
</html>
